theme = "cat"

[editor]
color-modes = true
true-color = true
mouse = false

[editor.gutters]
layout = ["diagnostics", "spacer", "diff", "spacer"]


[editor.file-picker]
hidden = false

[editor.cursor-shape]
insert = "bar"
normal = "block"

[keys.normal]
X = "extend_line_above"

[editor.statusline]
left = []
right = []
center = []

[editor.lsp]
display-messages = false
auto-signature-help = false
goto-reference-include-declaration = false
